name: Event OS Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Verify CI Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Typecheck & Test
        run: npm run test

      - name: 🏗️ Build All Workspaces
        run: npm run build

  deploy-containers:
    name: Build & Push Docker Images
    needs: [ci-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Check Docker Setup
        run: |
          echo "CI Quality Gate passed successfully."
          echo "Deployment target: Docker Compose / Container Registry"
          echo "Configured services:"
          echo "  - api-gateway"
          echo "  - auth-service"
          echo "  - event-service"
          echo "  - team-service"
          echo "  - ticket-service"
          echo "  - checkin-service"
          echo "  - announcement-service"
          echo "  - notification-service"

      # Optional: When DOCKER_USERNAME & DOCKER_PASSWORD secrets are configured
      - name: 🔐 Login to Docker Hub (Conditional)
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: 🚀 Deployment Summary
        run: |
          echo "======================================================="
          echo "Event OS Backend Deployment Ready"
          echo "To enable automated remote container push:"
          echo "Configure GitHub Secrets: DOCKER_USERNAME, DOCKER_PASSWORD"
          echo "======================================================="
