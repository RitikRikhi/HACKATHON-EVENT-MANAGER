version: '3.8'

services:
  # ============================================================================
  # API GATEWAY (Port 8000)
  # ============================================================================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: event-os-api-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT_GATEWAY=8000
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - EVENT_SERVICE_URL=http://event-service:8002
      - TEAM_SERVICE_URL=http://team-service:8003
      - TICKET_SERVICE_URL=http://ticket-service:8004
      - CHECKIN_SERVICE_URL=http://checkin-service:8005
      - ANNOUNCEMENT_SERVICE_URL=http://announcement-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
    depends_on:
      - auth-service
      - event-service
      - team-service
      - ticket-service
      - checkin-service
      - announcement-service
      - notification-service
    networks:
      - event-os-network
    restart: unless-stopped

  # ============================================================================
  # AUTH SERVICE (Port 8001)
  # ============================================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: event-os-auth-service
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT_AUTH=8001
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - EMAIL_FROM=${EMAIL_FROM:-"Event OS" <noreply@eventos.com>}
    networks:
      - event-os-network
    restart: unless-stopped

  # ============================================================================
  # EVENT SERVICE (Port 8002)
  # ============================================================================
  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    container_name: event-os-event-service
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=production
      - PORT_EVENT=8002
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
    networks:
      - event-os-network
    restart: unless-stopped

  # ============================================================================
  # TEAM SERVICE (Port 8003)
  # ============================================================================
  team-service:
    build:
      context: .
      dockerfile: services/team-service/Dockerfile
    container_name: event-os-team-service
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=production
      - PORT_TEAM=8003
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
    networks:
      - event-os-network
    restart: unless-stopped

  # ============================================================================
  # TICKET SERVICE (Port 8004)
  # ============================================================================
  ticket-service:
    build:
      context: .
      dockerfile: services/ticket-service/Dockerfile
    container_name: event-os-ticket-service
    ports:
      - "8004:8004"
    environment:
      - NODE_ENV=production
      - PORT_TICKET=8004
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - EVENT_SERVICE_URL=http://event-service:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
    networks:
      - event-os-network
    restart: unless-stopped

  # ============================================================================
  # CHECK-IN SERVICE (Port 8005)
  # ============================================================================
  checkin-service:
    build:
      context: .
      dockerfile: services/checkin-service/Dockerfile
    container_name: event-os-checkin-service
    ports:
      - "8005:8005"
    environment:
      - NODE_ENV=production
      - PORT_CHECKIN=8005
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TICKET_SERVICE_URL=http://ticket-service:8004
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
    networks:
      - event-os-network
    restart: unless-stopped

  # ============================================================================
  # ANNOUNCEMENT SERVICE (Port 8006)
  # ============================================================================
  announcement-service:
    build:
      context: .
      dockerfile: services/announcement-service/Dockerfile
    container_name: event-os-announcement-service
    ports:
      - "8006:8006"
    environment:
      - NODE_ENV=production
      - PORT_ANNOUNCEMENT=8006
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
    networks:
      - event-os-network
    restart: unless-stopped

  # ============================================================================
  # NOTIFICATION SERVICE (Port 8007)
  # ============================================================================
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: event-os-notification-service
    ports:
      - "8007:8007"
    environment:
      - NODE_ENV=production
      - PORT_NOTIFICATION=8007
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_for_event_os_2026_production_grade}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - event-os-network
    restart: unless-stopped

networks:
  event-os-network:
    driver: bridge
